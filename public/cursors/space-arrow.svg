<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <path id="shape" d="M5.2 3.1C4 2.4 3 3.1 3.1 4.5L4 27.4c.1 1.9 2.1 2.6 3.2 1.1 3.6-5 9.2-8.2 17.6-9.4 2.4-.4 3-2.6 1.1-3.9z"/>
    <clipPath id="clip"><use href="#shape"/></clipPath>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b0f6b"/>
      <stop offset=".45" stop-color="#160843"/>
      <stop offset="1" stop-color="#07031d"/>
    </linearGradient>
    <radialGradient id="nebula" cx=".55" cy=".45" r=".5">
      <stop offset="0" stop-color="#e3b8ff" stop-opacity=".95"/>
      <stop offset=".35" stop-color="#a24dff" stop-opacity=".8"/>
      <stop offset="1" stop-color="#5b1fd1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ff7ae6" stop-opacity=".7"/>
      <stop offset="1" stop-color="#ff7ae6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Light halo keeps the cursor visible on the dark site background. -->
  <use href="#shape" fill="none" stroke="#efe6ff" stroke-opacity=".85" stroke-width="3.6" stroke-linejoin="round"/>
  <use href="#shape" transform="translate(1 1)" fill="#0a0418"/>
  <use href="#shape" fill="none" stroke="#120626" stroke-width="2" stroke-linejoin="round"/>
  <g clip-path="url(#clip)">
    <rect width="32" height="32" fill="url(#space)"/>
    <ellipse cx="13" cy="14" rx="11" ry="5" transform="rotate(38 13 14)" fill="url(#nebula)"/>
    <ellipse cx="9" cy="22" rx="5" ry="3.5" fill="url(#glow)"/>
    <g fill="#fff">
