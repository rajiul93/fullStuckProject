<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <!-- Index finger, three folded fingers and a palm with the thumb; drawn as overlapping parts. -->
    <rect id="index" x="10" y="1.5" width="5.6" height="19" rx="2.8"/>
    <rect id="middle" x="15" y="10" width="5" height="10" rx="2.5"/>
    <rect id="ring" x="19.5" y="11.5" width="4.8" height="9" rx="2.4"/>
    <rect id="pinky" x="23.8" y="13" width="4.6" height="8" rx="2.3"/>
    <path id="palm" d="M10 16h18.4v6c0 5.2-3.4 8.5-8.4 8.5h-4.6c-2.8 0-4.6-1.2-6.2-3.4l-5-6.6c-.9-1.2-.5-2.5.8-3 1.2-.5 2.3 0 3.2.9L10 21z"/>
    <g id="shape">
      <use href="#index"/><use href="#middle"/><use href="#ring"/><use href="#pinky"/><use href="#palm"/>
    </g>
    <!-- clipPath only accepts shapes (or <use> of shapes), not groups. -->
    <clipPath id="clip">
      <use href="#index"/><use href="#middle"/><use href="#ring"/><use href="#pinky"/><use href="#palm"/>
    </clipPath>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b0f6b"/>
      <stop offset=".5" stop-color="#160843"/>
      <stop offset="1" stop-color="#07031d"/>
    </linearGradient>
    <radialGradient id="nebula" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#e3b8ff" stop-opacity=".95"/>
      <stop offset=".35" stop-color="#a24dff" stop-opacity=".8"/>
      <stop offset="1" stop-color="#5b1fd1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ff7ae6" stop-opacity=".7"/>
      <stop offset="1" stop-color="#ff7ae6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <use href="#shape" fill="none" stroke="#efe6ff" stroke-opacity=".85" stroke-width="3.6" stroke-linejoin="round"/>
  <use href="#shape" transform="translate(1 1)" fill="#0a0418"/>
  <use href="#shape" fill="none" stroke="#120626" stroke-width="2" stroke-linejoin="round"/>
  <g clip-path="url(#clip)">
    <rect width="32" height="32" fill="url(#space)"/>
    <ellipse cx="16" cy="17" rx="14" ry="4.5" transform="rotate(-55 16 17)" fill="url(#nebula)"/>
    <ellipse cx="22" cy="24" rx="6" ry="4" fill="url(#glow)"/>
    <g fill="#fff">
      <circle cx="12.5" cy="5" r=".5"/>
      <circle cx="13.5" cy="11" r=".35"/>
      <circle cx="17.5" cy="13" r=".45"/>
      <circle cx="25.5" cy="16" r=".4"/>
      <circle cx="20" cy="20" r=".6"/>
      <circle cx="13" cy="25" r=".45"/>
      <circle cx="24" cy="26.5" r=".35"/>
      <circle cx="7" cy="20.5" r=".35"/>
    </g>
    <!-- Creases between the folded fingers. -->
    <path d="M15.2 12.5v5M19.7 13.5v4.5M24 15v4" stroke="#120626" stroke-opacity=".7" stroke-width=".8" stroke-linecap="round"/>
  </g>
</svg>
